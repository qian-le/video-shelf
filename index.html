<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书架 · 视频课程 · 图文电子书库</title>
<style>
/* Shelf design tokens — 单主题浅色暖纸 */
:root {
  --bg: #F4EFE6;
  --surface: #FFFCF7;
  --ink: #252A27;
  --muted: #626862;
  --faint: #8A908A;
  --accent: #0F766E;
  --accent-soft: rgba(15, 118, 110, 0.08);
  --accent-ink: #0B5C56;
  --line: #E4DDD0;
  --line-strong: #D2C9B8;
  --code-bg: #F0EBE1;
  --shadow: 0 1px 2px rgba(37, 42, 39, 0.04), 0 8px 24px rgba(37, 42, 39, 0.06);

  --font-ui: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-read: Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-mono: "Cascadia Code", Consolas, "Courier New", monospace;

  --text-body: 18px;
  --text-body-sm: 17px;
  --lh-body: 1.85;
  --measure: 720px;
  --measure-wide: 780px;

  --h1: clamp(1.9rem, 2.4vw, 2.35rem);
  --h2: clamp(1.45rem, 1.8vw, 1.65rem);
  --h3: clamp(1.2rem, 1.4vw, 1.32rem);

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;

  --r-ctl: 6px;
  --r-media: 10px;
  --r-panel: 12px;

  --topbar-h: 52px;
  --toc-w: 260px;
}

@media (max-width: 640px) {
  :root {
    --text-body: var(--text-body-sm);
  }
}

/* 书架索引 — 暖纸主题；首页为课程合集 */
body.shelf-page {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
}
.shelf-wrap { max-width: 960px; margin: 0 auto; padding: var(--sp-7) var(--sp-5) var(--sp-8); }

.shelf-header {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: var(--sp-4); margin-bottom: var(--sp-5);
  padding-bottom: var(--sp-5); border-bottom: 1px solid var(--line);
}
.shelf-brand h1 {
  font-family: var(--font-read);
  font-size: clamp(1.85rem, 3vw, 2.25rem); font-weight: 700; letter-spacing: .06em;
  color: var(--ink); margin: 0;
}
.shelf-brand h1 em { font-style: normal; color: var(--accent); }
.shelf-brand p { margin: var(--sp-2) 0 0; color: var(--muted); font-size: 14px; }
.shelf-brand .crumb { margin: 0 0 var(--sp-2); font-size: 14px; }
.shelf-brand .crumb a { color: var(--accent); text-decoration: none; font-weight: 600; }
.shelf-brand .crumb a:hover { text-decoration: underline; }
.shelf-count {
  font-family: var(--font-mono); font-size: 12px; color: var(--faint);
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface);
}

.shelf-toolbar { margin-bottom: var(--sp-5); font-family: var(--font-ui); }
.shelf-toolbar.simple { display: block; }
.shelf-toolbar input[type="search"] {
  width: 100%; min-height: 42px; padding: 0 14px; border-radius: var(--r-ctl);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 14px; font-family: inherit;
}
.shelf-toolbar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.clear-filters {
  min-height: 36px; padding: 0 12px; border-radius: var(--r-ctl);
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-size: 13px; cursor: pointer; font-family: inherit; margin-top: var(--sp-3);
}
.clear-filters:hover { color: var(--ink); }

/* 课程合集卡 */
#shelf-root { display: grid; gap: var(--sp-5); }
.collection-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  padding: var(--sp-5) var(--sp-5) var(--sp-4) calc(var(--sp-5) + 4px);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: var(--sp-4);
  transition: border-color .16s ease;
}
.collection-card:hover { border-color: rgba(15,118,110,.35); }
.collection-card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.collection-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: var(--r-panel) 0 0 var(--r-panel);
  background: var(--spine, var(--accent));
}
.collection-card .stretch {
  position: absolute; inset: 0; z-index: 1; text-indent: -9999px; overflow: hidden;
}
.collection-head {
  position: relative; z-index: 2; pointer-events: none;
  display: flex; gap: var(--sp-4); align-items: flex-start;
}
.collection-badge {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-family: var(--font-mono); font-size: 15px;
  color: #fff; background: var(--spine, var(--accent));
}
.collection-titles h2 {
  font-family: var(--font-read); font-size: 1.25rem; font-weight: 700;
  margin: 2px 0 6px; color: var(--ink); line-height: 1.35;
}
.collection-title-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3);
  margin: 2px 0 6px;
}
.collection-title-row h2 {
  font-family: var(--font-read); font-size: 1.25rem; font-weight: 700;
  margin: 0; color: var(--ink); line-height: 1.35;
}
.collection-title-row h1 {
  font-family: var(--font-read); font-size: clamp(1.75rem, 3vw, 2.15rem);
  font-weight: 700; margin: 0; color: var(--ink); line-height: 1.3;
}
.shelf-brand .collection-title-row { margin: 4px 0 0; }
.collection-author {
  display: inline-flex; align-items: center;
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  color: var(--accent-ink); background: var(--accent-soft);
  border: 1px solid rgba(15, 118, 110, 0.2);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  line-height: 1.4;
}
.card-eyebrow { font-size: 12px; color: var(--muted); margin: 0; }
.card-meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin: 0; }
.card-summary {
  font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 6px 0 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 次级讲次列表 */
.collection-lecs {
  position: relative; z-index: 2;
  list-style: none; margin: 0; padding: 0;
  border-top: 1px solid var(--line);
}
.collection-lec { border-bottom: 1px solid var(--border-subtle, var(--line)); }
.collection-lec a {
  display: grid; grid-template-columns: 40px 1fr; gap: var(--sp-3);
  align-items: baseline; padding: 10px 4px;
  text-decoration: none; color: var(--ink); font-size: 14px;
  border-radius: var(--r-ctl);
}
.collection-lec a:hover { background: var(--accent-soft); }
.collection-lec a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lec-num {
  font-family: var(--font-mono); font-size: 12px; color: var(--accent-ink); font-weight: 600;
}
.lec-title { line-height: 1.45; }

.card-actions {
  position: relative; z-index: 3; margin-top: auto;
  display: flex; justify-content: flex-end; gap: var(--sp-2); flex-wrap: wrap;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 36px; padding: 0 14px; border-radius: var(--r-ctl);
  font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  text-decoration: none; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line);
}
.btn:hover { border-color: var(--line-strong); background: var(--code-bg); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
}
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }

/* 课程页讲次行 */
.lecture-list { display: grid; gap: var(--sp-3); }
.lecture-row {
  position: relative; display: flex; gap: var(--sp-4); align-items: flex-start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel);
  padding: var(--sp-4) var(--sp-4) var(--sp-4) calc(var(--sp-4) + 4px);
  box-shadow: var(--shadow);
}
.lecture-row::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: var(--r-panel) 0 0 var(--r-panel);
  background: var(--spine, var(--accent));
}
.lecture-row .stretch {
  position: absolute; inset: 0; z-index: 1; text-indent: -9999px; overflow: hidden;
}
.lecture-num {
  position: relative; z-index: 2; pointer-events: none;
  font-family: var(--font-mono); font-weight: 700; font-size: 18px;
  color: var(--accent-ink); min-width: 36px; padding-top: 2px;
}
.lecture-body { position: relative; z-index: 2; pointer-events: none; flex: 1; min-width: 0; }
.lecture-body h2 {
  font-family: var(--font-read); font-size: 1.08rem; font-weight: 650;
  margin: 0 0 4px; color: var(--ink); line-height: 1.4;
}

.shelf-empty, .shelf-no-result {
  text-align: center; color: var(--muted);
  padding: var(--sp-7) var(--sp-5); border: 1px dashed var(--line-strong);
  border-radius: var(--r-panel); background: var(--surface);
  font-family: var(--font-ui); font-size: 14px;
}
.shelf-no-result[hidden], .shelf-empty[hidden], .collection-card[hidden] { display: none !important; }

.shelf-footer {
  margin-top: var(--sp-7); padding-top: var(--sp-4);
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap;
  color: var(--faint); font-size: 12px; font-family: var(--font-ui);
}

@media (max-width: 640px) {
  .shelf-wrap { padding: var(--sp-6) var(--sp-4) var(--sp-7); }
  .collection-head { flex-direction: row; }
  .lecture-row { flex-wrap: wrap; }
  .card-actions { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .collection-card, .lecture-row { transition: none; }
  .collection-card:hover { border-color: var(--line); }
}

</style>

<script>
(function () {
  function ready(fn) {
    if (document.readyState !== "loading") fn();
    else document.addEventListener("DOMContentLoaded", fn);
  }

  ready(function () {
    var root = document.getElementById("shelf-root");
    if (!root) return;
    var q = document.getElementById("shelf-search");
    var clear = document.getElementById("shelf-clear");
    var noResult = document.getElementById("shelf-no-result");
    var empty = document.getElementById("shelf-empty");
    var collections = Array.prototype.slice.call(root.querySelectorAll(".collection-card"));

    function norm(s) { return (s || "").toLowerCase().trim(); }

    function apply() {
      var query = norm(q && q.value);
      var visible = 0;
      collections.forEach(function (card) {
        var hay = norm(card.dataset.search);
        var lecHay = Array.prototype.slice
          .call(card.querySelectorAll(".collection-lec"))
          .map(function (li) { return norm(li.dataset.search); })
          .join(" ");
        var ok = !query || hay.indexOf(query) !== -1 || lecHay.indexOf(query) !== -1;
        card.hidden = !ok;
        if (ok) visible++;
      });
      var hasAny = collections.length > 0;
      if (empty) empty.hidden = hasAny;
      if (noResult) noResult.hidden = !(hasAny && visible === 0);
    }

    if (q) q.addEventListener("input", apply);
    if (clear) {
      clear.addEventListener("click", function () {
        if (q) q.value = "";
        apply();
      });
    }
    apply();
  });
})();

</script>
