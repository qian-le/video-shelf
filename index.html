<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书架 · 电子书库</title>
<style>
:root {
  --bg:#0B1220;
  --bg-2:#10182A;
  --card:#151E32;
  --card-hover:#1A2540;
  --ink:#E8EEF8;
  --muted:#8B97B0;
  --faint:#5C6B86;
  --jade:#3ECFAB;
  --jade-dim:#1a3d36;
  --gold:#D4A853;
  --line:rgba(148, 163, 184, 0.16);
  --radius:16px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { background:var(--bg); }
body {
  font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(62,207,171,.09), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(212,168,83,.06), transparent 50%),
    var(--bg);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
}
.wrap { max-width:1100px; margin:0 auto; padding:48px 24px 72px; }
header {
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:16px; padding-bottom:28px; margin-bottom:36px;
  border-bottom:1px solid var(--line);
}
.brand h1 {
  font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
  font-size:clamp(2rem, 4vw, 2.6rem); font-weight:600; letter-spacing:.12em;
  color:var(--ink);
}
.brand h1 em { font-style:normal; color:var(--jade); }
.brand p { margin-top:8px; color:var(--muted); font-size:14px; letter-spacing:.02em; }
.stat {
  font-family: "Cascadia Code", Consolas, monospace;
  font-size:12px; color:var(--faint); letter-spacing:.08em;
  padding:8px 12px; border:1px solid var(--line); border-radius:999px;
  background:rgba(255,255,255,.02);
}
.grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:18px;
}
.card {
  position:relative; overflow:hidden;
  display:flex; flex-direction:column; gap:18px;
  min-height:220px;
  background:linear-gradient(160deg, var(--card) 0%, var(--bg-2) 100%);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 22px 18px 24px;
  transition: border-color .18s ease, transform .18s ease, background .18s ease;
}
.card:hover {
  transform:translateY(-3px);
  border-color:rgba(62,207,171,.35);
  background:linear-gradient(160deg, var(--card-hover) 0%, var(--bg-2) 100%);
}
.card:focus-within { outline:2px solid var(--jade); outline-offset:2px; }
.card::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg, var(--spine, var(--jade)), transparent 90%);
}
.stretch {
  position:absolute; inset:0; z-index:1; text-indent:-9999px; overflow:hidden;
}
.stretch:focus-visible { outline:none; }
.num {
  position:absolute; right:12px; top:8px; z-index:0;
  font-family: Georgia, serif; font-size:72px; font-weight:600; line-height:1;
  color:rgba(232,238,248,.04); letter-spacing:-.04em;
  pointer-events:none; user-select:none;
}
.body { position:relative; z-index:2; pointer-events:none; flex:1; }
.eyebrow {
  font-family: "Cascadia Code", Consolas, monospace;
  font-size:11px; letter-spacing:.14em; color:var(--jade);
  margin-bottom:12px;
}
.card h2 {
  font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
  font-size:1.2rem; font-weight:600; line-height:1.45; color:var(--ink);
  margin-bottom:10px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.meta { color:var(--muted); font-size:12.5px; }
.actions {
  position:relative; z-index:2;
  display:flex; gap:10px; justify-content:flex-end; align-items:center;
  padding-top:4px;
}
.btn {
  display:inline-flex; align-items:center; justify-content:center;
  min-height:36px; padding:0 14px; border-radius:10px;
  font-size:13px; font-weight:500; text-decoration:none;
  color:var(--ink); background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { background:rgba(255,255,255,.08); border-color:rgba(148,163,184,.35); }
.btn:focus-visible { outline:2px solid var(--jade); outline-offset:2px; }
.btn.primary {
  background:var(--jade); border-color:var(--jade); color:#06281F; font-weight:600;
}
.btn.primary:hover { background:#5adcbb; border-color:#5adcbb; color:#041a14; }
.empty {
  grid-column:1/-1; text-align:center; color:var(--muted);
  padding:56px 24px; border:1px dashed var(--line); border-radius:var(--radius);
  background:rgba(255,255,255,.02);
}
footer {
  margin-top:48px; padding-top:20px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  color:var(--faint); font-size:12px;
}
@media (max-width:640px) {
  .wrap { padding:32px 16px 56px; }
  .card { min-height:200px; }
  .num { font-size:56px; }
}
@media (prefers-reduced-motion:reduce) {
  .card, .btn { transition:none; }
  .card:hover { transform:none; }
}
</style>
</head>
<body>

    <div class="brand">

      <p>视频课程 · 图文电子书库</p>
    </div>
    <div class="stat">1 VOL · SHELF</div>
  </header>
  <div class="grid">
      <article class="card" style="--spine:#3ECFAB">

        </div>
        <div class="actions">

  </div>
  <footer>

    <span>字幕 → 书籍化 → 截帧 → HTML</span>
  </footer>
</div>
</body>
